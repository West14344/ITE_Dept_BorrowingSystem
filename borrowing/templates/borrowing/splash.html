<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ITE Borrowing System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #2d1457; display: flex;
      align-items: center; justify-content: center;
      min-height: 100vh; overflow: hidden;
    }
    .splash-container { text-align: center; animation: fadeIn 0.8s ease forwards; }
    .logo-circle {
      width: 120px; height: 120px; border-radius: 50%;
      background: linear-gradient(135deg, #6b21a8, #9333ea);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px;
      animation: pulse 1.5s infinite, scaleIn 0.6s ease forwards;
    }
    .logo-circle i { font-size: 3rem; color: #fff; }
    .title {
      font-size: 2rem; font-weight: 800; color: #fff; letter-spacing: 2px;
      font-family: 'Segoe UI', sans-serif; opacity: 0;
      animation: slideUp 0.6s ease 0.4s forwards;
    }
    .subtitle {
      font-size: 0.95rem; color: #c084fc; margin-top: 8px; letter-spacing: 1px;
      opacity: 0; animation: slideUp 0.6s ease 0.6s forwards;
    }
    .loader {
      margin-top: 40px; display: flex; gap: 8px; justify-content: center;
      opacity: 0; animation: slideUp 0.6s ease 0.8s forwards;
    }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #9333ea; }
    .dot:nth-child(1) { animation: bounce 0.8s ease 0s infinite; }
    .dot:nth-child(2) { animation: bounce 0.8s ease 0.15s infinite; }
    .dot:nth-child(3) { animation: bounce 0.8s ease 0.3s infinite; }
    .loading-text {
      color: #7c3aed; font-size: 0.8rem; margin-top: 16px; letter-spacing: 2px;
      opacity: 0; animation: slideUp 0.6s ease 1s forwards;
      font-family: 'Segoe UI', sans-serif;
    }
    .particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    .particle {
      position: absolute; border-radius: 50%;
      background: rgba(147, 51, 234, 0.3);
      animation: float linear infinite;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes scaleIn {
      from { transform: scale(0.5); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(107, 33, 168, 0.7); }
      70%  { box-shadow: 0 0 0 20px rgba(107, 33, 168, 0); }
      100% { box-shadow: 0 0 0 0 rgba(107, 33, 168, 0); }
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0);     background: #9333ea; }
      50%       { transform: translateY(-16px); background: #c084fc; }
    }
    @keyframes float {
      0%   { transform: translateY(100vh) scale(0); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translateY(-100px) scale(1); opacity: 0; }
    }
  </style>
</head>
<body>
<div class="particles" id="particles"></div>
<div class="splash-container">
  <div class="logo-circle"><i class="bi bi-pc-display-horizontal"></i></div>
  <div class="title">ITE BORROWING</div>
  <div class="subtitle">Holy Child College of Davao</div>
  <div class="loader">
    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
  </div>
  <div class="loading-text">LOADING SYSTEM...</div>
</div>
<script>
  const container = document.getElementById('particles');
  for (let i = 0; i < 20; i++) {
    const p    = document.createElement('div');
    p.classList.add('particle');
    const size = Math.random() * 20 + 5;
    p.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;animation-duration:${Math.random()*6+4}s;animation-delay:${Math.random()*5}s;`;
    container.appendChild(p);
  }
  setTimeout(() => {
    document.body.style.transition = 'opacity 0.8s ease';
    document.body.style.opacity    = '0';
    setTimeout(() => { window.location.href = '/login/'; }, 800);
  }, 3000);
</script>
</body>
</html>
