<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Loading...</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #2d1457; display: flex; align-items: center;
      justify-content: center; min-height: 100vh; overflow: hidden;
      font-family: 'Segoe UI', sans-serif;
    }
    .loading-container { text-align: center; animation: fadeIn 0.5s ease forwards; }
    .icon-center { position: relative; width: 100px; height: 100px; margin: 0 auto 30px; }
    .spinner-ring {
      position: absolute; top: 0; left: 0;
      width: 100px; height: 100px; border-radius: 50%;
      border: 4px solid rgba(107, 33, 168, 0.2);
      border-top: 4px solid #9333ea;
      border-right: 4px solid #c084fc;
      animation: spin 1s linear infinite;
    }
    .icon-center i {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 2rem; color: #c084fc;
      animation: pulse 1.5s ease infinite;
    }
    .loading-title {
      font-size: 1.4rem; font-weight: 700; color: #fff; letter-spacing: 2px;
      opacity: 0; animation: slideUp 0.5s ease 0.3s forwards;
    }
    .loading-subtitle {
      font-size: 0.85rem; color: #c084fc; margin-top: 8px; letter-spacing: 1px;
      opacity: 0; animation: slideUp 0.5s ease 0.5s forwards;
    }
    .dots {
      margin-top: 30px; display: flex; gap: 8px; justify-content: center;
      opacity: 0; animation: slideUp 0.5s ease 0.7s forwards;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #9333ea; }
    .dot:nth-child(1) { animation: bounce 0.8s ease 0s infinite; }
    .dot:nth-child(2) { animation: bounce 0.8s ease 0.15s infinite; }
    .dot:nth-child(3) { animation: bounce 0.8s ease 0.3s infinite; }
    .progress-bar-wrap {
      width: 200px; height: 4px; background: rgba(107,33,168,0.3);
      border-radius: 10px; margin: 20px auto 0; overflow: hidden;
      opacity: 0; animation: slideUp 0.5s ease 0.9s forwards;
    }
    .progress-bar-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #6b21a8, #c084fc);
      border-radius: 10px; animation: fillBar 1.5s ease 1s forwards;
    }
    .particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    .particle { position: absolute; border-radius: 50%; background: rgba(147, 51, 234, 0.2); animation: float linear infinite; }
    @keyframes fadeIn  { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes spin    { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes pulse   { 0%, 100% { opacity:1; transform:translate(-50%,-50%) scale(1); } 50% { opacity:0.6; transform:translate(-50%,-50%) scale(0.9); } }
    @keyframes bounce  { 0%, 100% { transform: translateY(0); background: #9333ea; } 50% { transform: translateY(-12px); background: #c084fc; } }
    @keyframes fillBar { from { width: 0%; } to { width: 100%; } }
    @keyframes float   { 0% { transform: translateY(100vh) scale(0); opacity:0; } 10% { opacity:1; } 90% { opacity:1; } 100% { transform: translateY(-100px) scale(1); opacity:0; } }
  </style>
</head>
<body>
<div class="particles" id="particles"></div>
<div class="loading-container">
  <div class="icon-center">
    <div class="spinner-ring"></div>
    <i class="bi bi-{% if action == 'logout' %}box-arrow-left{% else %}speedometer2{% endif %}"></i>
  </div>
  <div class="loading-title">{% if action == 'logout' %}SIGNING OUT...{% else %}WELCOME BACK!{% endif %}</div>
  <div class="loading-subtitle">{% if action == 'logout' %}Redirecting to login page...{% else %}Loading your dashboard...{% endif %}</div>
  <div class="dots">
    <div class="dot"></div><div class="dot"></div><div class="dot"></div>
  </div>
  <div class="progress-bar-wrap"><div class="progress-bar-fill"></div></div>
</div>
<script>
  const container = document.getElementById('particles');
  for (let i = 0; i < 15; i++) {
    const p = document.createElement('div');
    p.classList.add('particle');
    const size = Math.random() * 15 + 5;
    p.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;animation-duration:${Math.random()*6+4}s;animation-delay:${Math.random()*3}s;`;
    container.appendChild(p);
  }
  setTimeout(() => {
    document.body.style.transition = 'opacity 0.5s ease';
    document.body.style.opacity    = '0';
    setTimeout(() => { window.location.href = '{{ redirect_url }}'; }, 500);
  }, 2000);
</script>
</body>
</html>
